<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paws & Claws - 精致宠物用品</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 确保遮罩层未打开时不挡住点击 */
        .drawer-closed {
            pointer-events: none !important;
            opacity: 0 !important;
        }
        .drawer-open {
            pointer-events: auto !important;
            opacity: 1 !important;
        }
    </style>
</head>
<body class="bg-amber-50/30 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- 顶部 Toast 提示 -->
    <div id="toast" class="fixed top-20 right-5 z-50 transform translate-x-full opacity-0 transition-all duration-300 bg-amber-900 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-2">
        <span class="text-xl">✨</span>
        <span id="toast-msg">已成功加入购物车！</span>
    </div>

    <!-- 导航栏 -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-amber-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="window.scrollTo({top:0, behavior:'smooth'})">
                <span class="text-2xl">🐾</span>
                <span class="font-bold text-xl text-amber-900">Paws & Claws</span>
            </div>
            <div class="flex items-center space-x-4">
                <button onclick="toggleCartDrawer(true)" class="relative bg-amber-600 text-white px-5 py-2 rounded-full text-sm font-medium hover:bg-amber-700 transition flex items-center space-x-2 shadow-sm cursor-pointer">
                    <span>🛒 购物车</span>
                    <span id="cart-badge" class="bg-white text-amber-900 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 英雄 Banner -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <div class="bg-gradient-to-r from-amber-100 to-orange-100 rounded-3xl p-8 md:p-12 flex flex-col md:flex-row items-center justify-between shadow-sm">
            <div class="max-w-xl mb-6 md:mb-0">
                <span class="bg-amber-200 text-amber-800 text-xs font-bold px-3 py-1 rounded-full uppercase">新季特惠</span>
                <h1 class="text-3xl md:text-4xl font-extrabold text-amber-950 mt-3 mb-4 leading-tight">给毛孩子更天然、健康的宠爱</h1>
                <p class="text-slate-600 text-sm md:text-base mb-6">精选全球优质宠物食品与美学生活用品，守护每一刻温情陪伴。</p>
            </div>
            <div class="text-7xl">🐶🐱</div>
        </div>
    </section>

    <!-- 商品列表 -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        <h2 class="text-2xl font-bold text-slate-900 mb-6">人气热销</h2>
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
    </section>

    <!-- 购物车侧边抽屉 -->
    <div id="drawer-overlay" onclick="toggleCartDrawer(false)" class="fixed inset-0 bg-slate-900/30 z-50 transition-opacity duration-300 drawer-closed"></div>
    
    <div id="drawer-content" class="fixed top-0 right-0 h-full w-full max-w-md bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col p-6">
        <div class="flex justify-between items-center pb-4 border-b border-slate-100">
            <h3 class="text-lg font-bold text-slate-800">我的购物车</h3>
            <button onclick="toggleCartDrawer(false)" class="text-slate-400 hover:text-slate-600 text-2xl font-bold cursor-pointer">&times;</button>
        </div>
        <div id="cart-items" class="flex-grow overflow-y-auto py-4 space-y-4"></div>
        <div class="border-t border-slate-100 pt-4 space-y-4">
            <div class="flex justify-between items-center text-lg font-bold">
                <span>合计金额：</span>
                <span id="cart-total-price" class="text-rose-600">¥ 0.00</span>
            </div>
            <button onclick="handleCheckout()" class="w-full bg-amber-900 text-white py-3.5 rounded-2xl font-medium hover:bg-amber-950 transition text-center shadow-lg cursor-pointer">
                立即结算
            </button>
        </div>
    </div>

    <!-- 脚本逻辑 -->
    <script>
        const products = [
            { id: 1, name: "天然无谷全价猫粮 5kg", category: "主粮专区", price: 198.00, tag: "罐头/主粮" },
            { id: 2, name: "耐咬洁牙互动漏食球", category: "玩具互动", price: 49.00, tag: "趣味玩具" },
            { id: 3, name: "四季通用软糯宠物窝", category: "生活美学", price: 128.00, tag: "舒适睡眠" },
            { id: 4, name: "静音无线循环活水机", category: "智能科技", price: 159.00, tag: "智能饮水" }
        ];

        let cart = JSON.parse(localStorage.getItem('paws_cart')) || [];

        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            updateCartUI();
        });

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map(p => `
                <div class="bg-white rounded-2xl p-4 border border-slate-100 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                    <div>
                        <div class="bg-amber-100 text-amber-900 h-36 rounded-xl flex items-center justify-center text-lg font-bold mb-4">
                            ${p.tag}
                        </div>
                        <span class="text-xs text-amber-600 font-semibold">${p.category}</span>
                        <h3 class="font-bold text-slate-800 mt-1">${p.name}</h3>
                    </div>
                    <div class="flex items-center justify-between mt-4 pt-2 border-t border-slate-50">
                        <span class="text-lg font-bold text-rose-600">¥ ${p.price.toFixed(2)}</span>
                        <button onclick="addToCart(${p.id})" class="bg-amber-100 text-amber-900 px-4 py-2 rounded-xl hover:bg-amber-200 transition text-sm font-medium cursor-pointer">
                            + 加购
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            console.log("成功触发加购！商品ID：", productId);
            const product = products.find(p => p.id === productId);
            const existItem = cart.find(item => item.id === productId);

            if (existItem) {
                existItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            saveCart();
            showToast(`已将「${product.name}」加入购物车！`);
        }

        function saveCart() {
            localStorage.setItem('paws_cart', JSON.stringify(cart));
            updateCartUI();
        }

        function updateCartUI() {
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cart-badge').innerText = totalCount;

            const container = document.getElementById('cart-items');
            const totalPriceEl = document.getElementById('cart-total-price');

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 py-12">购物车空空如也 🐾</p>`;
                totalPriceEl.innerText = '¥ 0.00';
                return;
            }

            let totalPrice = 0;
            container.innerHTML = cart.map(item => {
                totalPrice += item.price * item.quantity;
                return `
                    <div class="flex items-center justify-between bg-slate-50 p-3 rounded-2xl">
                        <div>
                            <h4 class="text-sm font-bold text-slate-800">${item.name}</h4>
                            <p class="text-xs text-rose-600 font-semibold mt-0.5">¥ ${item.price.toFixed(2)}</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="changeQuantity(${item.id}, -1)" class="w-7 h-7 bg-white border rounded-full flex items-center justify-center font-bold text-slate-600 hover:bg-slate-100 cursor-pointer">-</button>
                            <span class="text-sm font-bold w-4 text-center">${item.quantity}</span>
                            <button onclick="changeQuantity(${item.id}, 1)" class="w-7 h-7 bg-white border rounded-full flex items-center justify-center font-bold text-slate-600 hover:bg-slate-100 cursor-pointer">+</button>
                        </div>
                    </div>
                `;
            }).join('');

            totalPriceEl.innerText = `¥ ${totalPrice.toFixed(2)}`;
        }

        function changeQuantity(productId, delta) {
            const item = cart.find(i => i.id === productId);
            if (!item) return;
            item.quantity += delta;
            if (item.quantity <= 0) {
                cart = cart.filter(i => i.id !== productId);
            }
            saveCart();
        }

        function toggleCartDrawer(open) {
            const overlay = document.getElementById('drawer-overlay');
            const content = document.getElementById('drawer-content');
            if (open) {
                overlay.classList.remove('drawer-closed');
                overlay.classList.add('drawer-open');
                content.classList.remove('translate-x-full');
            } else {
                overlay.classList.remove('drawer-open');
                overlay.classList.add('drawer-closed');
                content.classList.add('translate-x-full');
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('translate-x-full', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
            }, 2000);
        }

        function handleCheckout() {
            if (cart.length === 0) {
                alert('购物车里还没有商品哦！');
                return;
            }
            alert('🎉 订单提交成功！本地结算模拟完成。');
            cart = [];
            saveCart();
            toggleCartDrawer(false);
        }
    </script>
</body>
</html>
